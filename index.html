<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz-App</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="quiz-container">
      <h1 id="question">Frage</h1>
      <div class="answerbuttons hidden">
        <button id="answer-one">Antwort 1</button>
        <button id="answer-two">Antwort 2</button>
        <button id="answer-three">Antwort 3</button>
        <button id="answer-four">Antwort 4</button>
      </div>
      <div class="underbuttons">
        <button id="solution">Lösung</button>
        <button id="next">Weiter</button>
      </div>
    </div>
  </body>
</html>
